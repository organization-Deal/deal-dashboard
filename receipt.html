<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เอกสารอัตโนมัติ · รับจ่ายได้หมด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f2;--card:#fff;--ink:#17251f;--muted:#66736b;--line:#dde4de;--green:#12674f;--green2:#e5f1eb;--orange:#dc6234;--orange2:#fff0e9;--red:#b83a2e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:15px}.wrap{max-width:1080px;margin:auto;padding:24px 18px 60px}.top{display:flex;align-items:flex-start;gap:16px;justify-content:space-between;margin-bottom:18px}.top h1{font-size:26px;margin:0}.top p{margin:4px 0 0;color:var(--muted)}a{text-decoration:none;color:inherit}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn:hover{border-color:var(--green)}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn.orange{background:var(--orange);color:#fff;border-color:var(--orange)}.flow{background:var(--green2);border:1px solid #cbe0d4;border-radius:14px;padding:14px 16px;margin-bottom:18px;font-weight:600}.grid{display:grid;grid-template-columns:360px 1fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 4px 18px rgba(20,40,30,.04)}h2{font-size:18px;margin:0 0 4px}.sub{color:var(--muted);font-size:13px;margin-bottom:16px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;font:inherit;background:#fff}.field textarea{min-height:72px;resize:vertical}.upload{display:flex;gap:8px;align-items:center}.upload input[type=file]{font-size:12px}.status{font-size:12px;margin-top:6px;color:var(--muted)}.status.bad{color:var(--red)}.status.ok{color:var(--green)}.rows{display:flex;flex-direction:column;gap:10px}.row{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fff}.rowhead{display:flex;gap:14px;justify-content:space-between}.amount{font-size:22px;font-weight:700}.vendor{font-weight:700}.meta{color:var(--muted);font-size:12.5px;margin-top:2px}.docs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.doc{padding:8px 11px;border-radius:9px;background:#f6f7f6;border:1px solid var(--line);font-size:13px;font-weight:600}.doc.ready{background:var(--green2);border-color:#cbe0d4;color:var(--green)}.doc.receipt{background:var(--orange2);border-color:#f2cdbc;color:#a84420}.missing{font-size:12px;color:var(--muted);padding:8px 0}.empty{padding:48px 20px;text-align:center;color:var(--muted)}.badge{display:inline-flex;padding:3px 8px;border-radius:999px;font-size:11px;background:#eef1ee;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;background:#1d2b25;color:#fff;padding:12px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s}.toast.on{opacity:1}.toast.bad{background:#8c2d25}@media(max-width:820px){.grid{grid-template-columns:1fr}.top{flex-direction:column}.top .btn{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>เอกสารอัตโนมัติ</h1><p>ไม่ต้องเลือก ไม่ต้องกดพิมพ์ ระบบสร้าง PDF และเก็บใน Google Drive ให้ตอนกดบันทึกใน LINE</p></div>
    <a id="back" class="btn" href="#">← กลับแดชบอร์ด</a>
  </div>
  <div class="flow">ตั้งเบิกใน LINE → กดบันทึก → ระบบสร้าง “ใบเบิก” + “ใบแทน” → ใส่ลิงก์ลง Google Sheet อัตโนมัติ</div>
  <div class="grid">
    <section class="card">
      <h2>ข้อมูลบริษัท</h2><div class="sub">กรอกครั้งเดียว ใช้กับเอกสารทุกใบ</div>
      <div class="field"><label>ชื่อบริษัท</label><input id="company"></div>
      <div class="field"><label>ที่อยู่บริษัท</label><textarea id="address"></textarea></div>
      <div class="field"><label>เลขประจำตัวผู้เสียภาษี</label><input id="taxid"></div>
      <div class="field"><label>ชื่อผู้อนุมัติ</label><input id="approver"></div>
      <div class="field"><label>โลโก้</label><div class="upload"><input id="logoFile" type="file" accept="image/*"><button class="btn" onclick="uploadAsset('logo')">อัปโหลด</button></div><input id="logo" placeholder="ลิงก์โลโก้ใน Drive" style="margin-top:8px"><div id="logoStatus" class="status"></div></div>
      <div class="field"><label>ลายเซ็นผู้อนุมัติ</label><div class="upload"><input id="signFile" type="file" accept="image/*"><button class="btn" onclick="uploadAsset('sign')">อัปโหลด</button></div><input id="sign" placeholder="ลิงก์ลายเซ็นใน Drive" style="margin-top:8px"><div id="signStatus" class="status"></div></div>
      <button class="btn primary" style="width:100%" onclick="saveSettings()">บันทึกข้อมูลบริษัท</button>
      <div id="saveStatus" class="status"></div>
    </section>
    <section class="card">
      <h2>ใบเบิก + ใบแทน</h2><div class="sub" id="listStat">กำลังโหลด…</div>
      <div class="rows" id="rows"></div>
    </section>
  </div>
</div>
<div id="toast" class="toast"></div>
<script>
const WORKER='https://accoutingsuppor02.organization-23c.workers.dev';
const Q=new URLSearchParams(location.search);const TENANT=Q.get('tenant')||'';const KEY=Q.get('k')||'';const FOCUS=Q.get('id')||'';
const QS=`?tenant=${encodeURIComponent(TENANT)}&k=${encodeURIComponent(KEY)}`;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const money=n=>(Number(n)||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
let RECORDS=[],SETTINGS={};
function api(path){return WORKER+path+QS}function toast(msg,bad=false){const e=$('toast');e.textContent=msg;e.className='toast on'+(bad?' bad':'');setTimeout(()=>e.className='toast',2600)}
function fileToBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]||'');r.onerror=reject;r.readAsDataURL(file)})}
async function uploadAsset(kind){const file=$(kind==='logo'?'logoFile':'signFile').files[0];const st=$(kind==='logo'?'logoStatus':'signStatus');if(!file){st.textContent='เลือกไฟล์ก่อน';st.className='status bad';return}if(file.size>5*1024*1024){st.textContent='ไฟล์ใหญ่เกิน 5 MB';st.className='status bad';return}st.textContent='กำลังอัปขึ้น Drive…';st.className='status';try{const base64=await fileToBase64(file);const res=await fetch(api('/api/upload-image'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({base64,mediaType:file.type||'image/png',name:`${kind}-${Date.now()}.${(file.name.split('.').pop()||'png')}`})});const out=await res.json();if(!out.ok)throw new Error(out.error||'upload failed');$(kind==='logo'?'logo':'sign').value=out.url;st.textContent='อัปโหลดแล้ว';st.className='status ok'}catch(e){st.textContent='อัปโหลดไม่สำเร็จ: '+e.message;st.className='status bad'}}
async function load(){if(!TENANT||!KEY){$('rows').innerHTML='<div class="empty">เปิดหน้านี้จากลิงก์ใน LINE</div>';return}$('back').href='/?tenant='+encodeURIComponent(TENANT)+'&k='+encodeURIComponent(KEY);try{const [rr,ss]=await Promise.all([fetch(api('/api/expenses')).then(r=>r.json()),fetch(api('/api/settings')).then(r=>r.json())]);if(!Array.isArray(rr))throw new Error(rr.hint||rr.error||'โหลดรายการไม่ได้');RECORDS=FOCUS?rr.filter(r=>r.id===FOCUS):rr.filter(r=>r.type!=='รายรับ');SETTINGS=ss.error?{}:ss;fillSettings();render();if(FOCUS&&RECORDS[0]&&(!RECORDS[0].claimPdfUrl||!RECORDS[0].receiptPdfUrl)&&SETTINGS.company_name&&SETTINGS.tax_id&&SETTINGS.approver_name){await generate(FOCUS)}}catch(e){$('rows').innerHTML='<div class="empty">โหลดไม่สำเร็จ: '+esc(e.message)+'</div>';toast(e.message,true)}}
function fillSettings(){$('company').value=SETTINGS.company_name||'';$('address').value=(SETTINGS.company_address||'').replace(/\\n/g,'\n');$('taxid').value=SETTINGS.tax_id||'';$('approver').value=SETTINGS.approver_name||'';$('logo').value=SETTINGS.logo_url||'';$('sign').value=SETTINGS.approver_sign_url||''}
function render(){$('listStat').textContent=`${RECORDS.length} รายการ · เอกสารทั้งหมดอยู่ใน Google Drive`;if(!RECORDS.length){$('rows').innerHTML='<div class="empty">ยังไม่มีรายการ</div>';return}$('rows').innerHTML=RECORDS.map(r=>{const docs=[];if(r.imageUrl||r.img)docs.push(`<a class="doc" target="_blank" rel="noopener" href="${esc(r.imageUrl||r.img)}">📎 หลักฐาน</a>`);if(r.claimPdfUrl)docs.push(`<a class="doc ready" target="_blank" rel="noopener" href="${esc(r.claimPdfUrl)}">📄 ใบเบิก PDF</a>`);if(r.receiptPdfUrl)docs.push(`<a class="doc receipt" target="_blank" rel="noopener" href="${esc(r.receiptPdfUrl)}">🧾 ใบแทน PDF</a>`);const miss=(!r.claimPdfUrl||!r.receiptPdfUrl)?'<div class="missing">กำลังสร้างเอกสารอัตโนมัติ หรือข้อมูลบริษัทอาจยังไม่ครบ</div>':'';return `<div class="row"><div class="rowhead"><div><div class="vendor">${esc(r.vendor||'—')}</div><div class="meta">ผู้โอน: ${esc(r.transferor||'—')} · ผู้เบิก: ${esc(r.payerName||r.sender||'—')}<br>${esc(r.dateText||r.date||'')} · ${esc(r.category||'')}</div></div><div style="text-align:right"><div class="amount">฿${money(r.amount)}</div><span class="badge">${esc(r.status||'รอเบิก')}</span></div></div><div class="docs">${docs.join('')}</div>${miss}</div>`}).join('')}
async function generate(id,force=false){$('listStat').textContent='กำลังสร้างใบเบิกและใบแทน PDF…';try{const res=await fetch(api('/api/generate-docs'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,force})});const out=await res.json();if(!out.ok)throw new Error(out.hint||out.error||'สร้างเอกสารไม่สำเร็จ');const i=RECORDS.findIndex(r=>r.id===id);if(i>=0)RECORDS[i]=out.record;render();toast('สร้างใบเบิกและใบแทนแล้ว')}catch(e){$('listStat').textContent='สร้างเอกสารไม่สำเร็จ';toast(e.message,true)}}
async function saveSettings(){const body={company_name:$('company').value.trim(),company_address:$('address').value.trim().replace(/\n/g,'\\n'),tax_id:$('taxid').value.trim(),approver_name:$('approver').value.trim(),logo_url:$('logo').value.trim(),approver_sign_url:$('sign').value.trim(),doc_prefix:SETTINGS.doc_prefix||'R'};$('saveStatus').textContent='กำลังบันทึก…';try{const res=await fetch(api('/api/settings'),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const out=await res.json();if(out.error)throw new Error(out.error);SETTINGS=out;$('saveStatus').textContent='บันทึกแล้ว';$('saveStatus').className='status ok';toast('บันทึกข้อมูลบริษัทแล้ว');if(FOCUS)await generate(FOCUS,true)}catch(e){$('saveStatus').textContent='บันทึกไม่สำเร็จ: '+e.message;$('saveStatus').className='status bad';toast(e.message,true)}}
load();
</script>
</body>
</html>
